name: CI

on:
  push:
    paths:
      - 'scripts/**'
      - 'pipeline/scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'pipeline/scripts/**'
      - '.github/workflows/ci.yml'

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: node --check all JS
        run: |
          set -euo pipefail
          files=$(find scripts pipeline/scripts -name '*.js' -type f)
          if [ -z "$files" ]; then
            echo "no JS files under scripts/ or pipeline/scripts/"; exit 1
          fi
          for f in $files; do
            echo "checking $f"
            node --check "$f"
          done
